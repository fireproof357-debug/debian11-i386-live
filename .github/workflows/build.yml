name: Build Debian 11 i386 Live ISO
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Debian 11 container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            debian:bullseye bash build.sh
      - name: Upload ISO and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debian11-i386-gparted-live
          path: output/
          if-no-files-found: error
