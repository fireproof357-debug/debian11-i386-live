name: Build Debian 11 i386 Live ISO
on:
  workflow_dispatch:
  push:
    paths:
      - build.sh
      - .github/workflows/build.yml
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso isolinux syslinux-common squashfs-tools
      - name: Build ISO
        run: sudo bash build.sh
      - name: Upload ISO and checksums
        uses: actions/upload-artifact@v4
        with:
          name: debian11-i386-live-gparted
          path: output/
          if-no-files-found: error
          retention-days: 7
